[package]
name = "cgroup-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "cgroup_mcp"
path = "src/lib.rs"

[[bin]]
name = "cgroup-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
