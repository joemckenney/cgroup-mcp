[package]
name = "cgroup-mcp"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/joemckenney/cgroup-mcp"
# Note: `publish = false` is intentionally NOT set here. release-plz reads
# this field too and treats `false` as "skip this crate entirely," which
# silently disables version-bump PRs. The crates.io publish step is
# suppressed in release-plz.toml instead.

[lib]
name = "cgroup_mcp"
path = "src/lib.rs"

[[bin]]
name = "cgroup-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
